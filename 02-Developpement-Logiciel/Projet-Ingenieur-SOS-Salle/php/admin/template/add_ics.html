<!DOCTYPE html>
<html lang='fr'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Ajouter un fichier ICS</title>
    <link rel='stylesheet'>
</head>
<body>
    <h1>Ajouter un fichier ICS</h1>
    <form id='add_ics_form' action='../../action/add_ics.php' method='POST'>
        <label for='url_ics'>URL Calendar:</label>
        <input type='text' id='url_ics' name='url_ics' maxlength='255' required>
        <br>
        
        <label for='formation'>Formation:</label>
        <input type='text' id='formation' name='formation' maxlength='63' required>
        <br>
        
        <button type='submit' value='Valider' href='add_ics.php'>Valider</button>
    </form>
    <script>
        document.getElementById('add_ics_form').addEventListener('submit', function() {
            window.location.href = '../action/add_ics.php';
        });
    </script>
</body>
</html>
